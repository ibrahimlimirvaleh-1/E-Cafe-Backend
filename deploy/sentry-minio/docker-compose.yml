services:
  postgres:
    image: postgres:15
    container_name: ecafe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentry}
      POSTGRES_USER: ${POSTGRES_USER:-sentry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentryStrongPass123}
    volumes:
      - sentry-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentry}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ecafe-redis
    restart: unless-stopped
    volumes:
      - sentry-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:${MINIO_IMAGE_TAG:-latest}
    container_name: ecafe-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioStrongPass123}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9011}:9001"
    volumes:
      - minio-data:/data

  ecafe-db:
    image: postgres:15
    container_name: ecafe-app-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ECAFE_DB_NAME:-ECafe}
      POSTGRES_USER: ${ECAFE_DB_USER:-ecafe_user}
      POSTGRES_PASSWORD: ${ECAFE_DB_PASSWORD:-StrongPass123}
    ports:
      - "${ECAFE_DB_PORT:-5433}:5432"
    volumes:
      - ecafe-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ECAFE_DB_USER:-ecafe_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  sentry-init:
    image: getsentry/sentry:${SENTRY_IMAGE_TAG:-latest}
    container_name: ecafe-sentry-init
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SENTRY_SECRET_KEY: ${SENTRY_SECRET_KEY}
      SENTRY_POSTGRES_HOST: postgres
      SENTRY_DB_NAME: ${POSTGRES_DB:-sentry}
      SENTRY_DB_USER: ${POSTGRES_USER:-sentry}
      SENTRY_DB_PASSWORD: ${POSTGRES_PASSWORD:-sentryStrongPass123}
      SENTRY_REDIS_HOST: redis
      SENTRY_SINGLE_ORGANIZATION: "1"
    command: ["sentry", "upgrade", "--noinput"]

  sentry-web:
    image: getsentry/sentry:${SENTRY_IMAGE_TAG:-latest}
    container_name: ecafe-sentry-web
    restart: unless-stopped
    depends_on:
      sentry-init:
        condition: service_completed_successfully
    environment:
      SENTRY_SECRET_KEY: ${SENTRY_SECRET_KEY}
      SENTRY_POSTGRES_HOST: postgres
      SENTRY_DB_NAME: ${POSTGRES_DB:-sentry}
      SENTRY_DB_USER: ${POSTGRES_USER:-sentry}
      SENTRY_DB_PASSWORD: ${POSTGRES_PASSWORD:-sentryStrongPass123}
      SENTRY_REDIS_HOST: redis
      SENTRY_SINGLE_ORGANIZATION: "1"
    command: ["sentry", "run", "web"]
    ports:
      - "${SENTRY_PORT:-9002}:9000"

  sentry-worker:
    image: getsentry/sentry:${SENTRY_IMAGE_TAG:-latest}
    container_name: ecafe-sentry-worker
    restart: unless-stopped
    depends_on:
      sentry-init:
        condition: service_completed_successfully
    environment:
      SENTRY_SECRET_KEY: ${SENTRY_SECRET_KEY}
      SENTRY_POSTGRES_HOST: postgres
      SENTRY_DB_NAME: ${POSTGRES_DB:-sentry}
      SENTRY_DB_USER: ${POSTGRES_USER:-sentry}
      SENTRY_DB_PASSWORD: ${POSTGRES_PASSWORD:-sentryStrongPass123}
      SENTRY_REDIS_HOST: redis
      SENTRY_SINGLE_ORGANIZATION: "1"
    command: ["sentry", "run", "worker"]

  sentry-cron:
    image: getsentry/sentry:${SENTRY_IMAGE_TAG:-latest}
    container_name: ecafe-sentry-cron
    restart: unless-stopped
    depends_on:
      sentry-init:
        condition: service_completed_successfully
    environment:
      SENTRY_SECRET_KEY: ${SENTRY_SECRET_KEY}
      SENTRY_POSTGRES_HOST: postgres
      SENTRY_DB_NAME: ${POSTGRES_DB:-sentry}
      SENTRY_DB_USER: ${POSTGRES_USER:-sentry}
      SENTRY_DB_PASSWORD: ${POSTGRES_PASSWORD:-sentryStrongPass123}
      SENTRY_REDIS_HOST: redis
      SENTRY_SINGLE_ORGANIZATION: "1"
    command: ["sentry", "run", "cron"]

  ecafe-api:
    build:
      context: ../..
      dockerfile: deploy/sentry-minio/Dockerfile
    container_name: ecafe-api
    restart: unless-stopped
    depends_on:
      ecafe-db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__EcafeDb: Host=ecafe-db;Port=5432;Database=${ECAFE_DB_NAME:-ECafe};Username=${ECAFE_DB_USER:-ecafe_user};Password=${ECAFE_DB_PASSWORD:-StrongPass123}
      Sentry__Dsn: ${ECAFE_SENTRY_DSN:-}
      Sentry__TracesSampleRate: ${ECAFE_SENTRY_TRACES_SAMPLE_RATE:-0.1}
    ports:
      - "${ECAFE_API_PORT:-8080}:8080"

volumes:
  sentry-postgres:
  sentry-redis:
  minio-data:
  ecafe-postgres: