
services:
  ecafe-db:
    image: postgres:15
    container_name: ecafe-app-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ECAFE_DB_NAME:-ECafe}
      POSTGRES_USER: ${ECAFE_DB_USER:-ecafe_user}
      POSTGRES_PASSWORD: ${ECAFE_DB_PASSWORD:?Set ECAFE_DB_PASSWORD in deploy/sentry-minio/.env}
    ports:
      - "${ECAFE_DB_PORT:-5433}:5432"
    volumes:
      - ecafe-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ECAFE_DB_USER:-ecafe_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ecafe-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ecafe-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: ecafe-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in deploy/sentry-minio/.env}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9011}:9001"
    volumes:
      - minio-data:/data

  ecafe-api:
    build:
      context: ../..
      dockerfile: deploy/sentry-minio/Dockerfile
    container_name: ecafe-api
    restart: unless-stopped
    depends_on:
      ecafe-db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080

      # PostgreSQL connection
      ConnectionStrings__ECafeDb: Host=ecafe-db;Port=5432;Database=${ECAFE_DB_NAME:-ECafe};Username=${ECAFE_DB_USER:-ecafe_user};Password=${ECAFE_DB_PASSWORD:?Set ECAFE_DB_PASSWORD in deploy/sentry-minio/.env}

      # Sentry deaktiv (lokalda özün run edəcəksən)
      Sentry__Dsn: ${ECAFE_SENTRY_DSN:-}
      Sentry__TracesSampleRate: ${ECAFE_SENTRY_TRACES_SAMPLE_RATE:-0.1}

      # MinIO
      MinIO__Endpoint: ecafe-minio:9000
      MinIO__AccessKey: ${MINIO_ROOT_USER:-minioadmin}
      MinIO__SecretKey: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in deploy/sentry-minio/.env}
      MinIO__BucketName: ${MINIO_BUCKET_NAME:-ecafefiles}
      MinIO__UseSSL: "false"

      # JWT
      Jwt__Key: ${ECAFE_JWT_KEY:?Set ECAFE_JWT_KEY in deploy/sentry-minio/.env}
      Jwt__Issuer: ${ECAFE_JWT_ISSUER:-ecafe}
      Jwt__Audience: ${ECAFE_JWT_AUDIENCE:-ecafe-users}

      # Redis (əlavə istifadə edəcəksənsə)
      Redis__Connection: ecafe-redis:6379

    ports:
      - "${ECAFE_API_PORT:-8080}:8080"

volumes:
  ecafe-postgres:
  ecafe-redis:
  minio-data:
