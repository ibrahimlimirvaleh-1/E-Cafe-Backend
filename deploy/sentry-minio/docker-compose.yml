
services:
  ecafe-db:
    image: postgres:15
    container_name: ecafe-app-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ECAFE_DB_NAME:-ECafe}
      POSTGRES_USER: ${ECAFE_DB_USER:-ecafe_user}
      POSTGRES_PASSWORD: ${ECAFE_DB_PASSWORD:-replace-with-local-db-password}
    ports:
      - "${ECAFE_DB_PORT:-5433}:5432"
    volumes:
      - ecafe-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ECAFE_DB_USER:-ecafe_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ecafe-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ecafe-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: ecafe-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-replace-with-local-minio-password}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9011}:9001"
    volumes:
      - minio-data:/data

  ecafe-api:
    build:
      context: ../..
      dockerfile: deploy/sentry-minio/Dockerfile
    container_name: ecafe-api
    restart: unless-stopped
    depends_on:
      ecafe-db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080

      # PostgreSQL connection
      ConnectionStrings__ECafeDb: Host=ecafe-db;Port=5432;Database=${ECAFE_DB_NAME:-ECafe};Username=${ECAFE_DB_USER:-ecafe_user};Password=${ECAFE_DB_PASSWORD:-replace-with-local-db-password}

      # Sentry deaktiv (lokalda özün run edəcəksən)
      Sentry__Dsn: ${ECAFE_SENTRY_DSN:-}
      Sentry__Debug: ${ECAFE_SENTRY_DEBUG:-false}
      Sentry__EnableLogs: ${ECAFE_SENTRY_ENABLE_LOGS:-false}
      Sentry__TracesSampleRate: ${ECAFE_SENTRY_TRACES_SAMPLE_RATE:-0.1}

      # MinIO
      MinIO__Endpoint: ecafe-minio:9000
      MinIO__AccessKey: ${MINIO_ROOT_USER:-minioadmin}
      MinIO__SecretKey: ${MINIO_ROOT_PASSWORD:-replace-with-local-minio-password}
      MinIO__BucketName: ${MINIO_BUCKET_NAME:-ecafefiles}
      MinIO__UseSSL: "false"
      FileStorage__PublicBaseUrl: ${ECAFE_PUBLIC_API_BASE_URL:-http://localhost:8081}

      # JWT
      Jwt__Key: ${ECAFE_JWT_KEY:-replace-with-long-random-jwt-key}
      Jwt__Issuer: ${ECAFE_JWT_ISSUER:-ecafe}
      Jwt__Audience: ${ECAFE_JWT_AUDIENCE:-ecafe-users}
      Jwt__AccessTokenLifetimeMinutes: ${ECAFE_JWT_ACCESS_TOKEN_LIFETIME_MINUTES:-15}

      # Browser access
      Cors__AllowedOrigins__0: ${ECAFE_FRONTEND_ORIGIN:-http://localhost:5173}
      Cors__AllowedOrigins__1: ${ECAFE_FRONTEND_ORIGIN_ALT:-http://127.0.0.1:5173}
      ForwardedHeaders__KnownProxies__0: ${ECAFE_KNOWN_PROXY_0:-}

      # Email
      Email__SmtpHost: ${ECAFE_EMAIL_SMTP_HOST:-smtp-relay.brevo.com}
      Email__SmtpPort: ${ECAFE_EMAIL_SMTP_PORT:-587}
      Email__Username: ${ECAFE_EMAIL_USERNAME:-}
      Email__Password: ${ECAFE_EMAIL_PASSWORD:-}
      Email__From: ${ECAFE_EMAIL_FROM:-}
      Email__FromName: ${ECAFE_EMAIL_FROM_NAME:-ECafe}
      Email__SecureSocketOption: ${ECAFE_EMAIL_SECURE_SOCKET_OPTION:-StartTls}
      Email__TimeoutSeconds: ${ECAFE_EMAIL_TIMEOUT_SECONDS:-30}
      Email__LocalDomain: ${ECAFE_EMAIL_LOCAL_DOMAIN:-localhost}

      # SMS
      Sms__Enabled: ${ECAFE_SMS_ENABLED:-false}
      Sms__Provider: ${ECAFE_SMS_PROVIDER:-Fake}
      Sms__BaseUrl: ${ECAFE_SMS_BASE_URL:-https://1sms.az/api/v1}
      Sms__ApiKey: ${ECAFE_SMS_API_KEY:-}
      Sms__Sender: ${ECAFE_SMS_SENDER:-1sms.az}

      # Redis
      Redis__Connection: ecafe-redis:6379

    ports:
      - "${ECAFE_API_PORT:-8081}:8080"

  ecafe-frontend:
    build:
      context: ../../../E-Cafe-Frontend
      dockerfile: Dockerfile
    container_name: ecafe-frontend
    restart: unless-stopped
    depends_on:
      - ecafe-api
    ports:
      - "${ECAFE_FRONTEND_PORT:-5173}:80"

volumes:
  ecafe-postgres:
  ecafe-redis:
  minio-data:
