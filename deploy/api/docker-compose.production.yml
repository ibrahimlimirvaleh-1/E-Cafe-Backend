services:
  api:
    image: ${ECAFE_API_IMAGE:-ecafe-api:local}
    build:
      context: ../..
      dockerfile: Dockerfile
      target: api
    env_file:
      - ./api.env
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  migrator:
    image: ${ECAFE_MIGRATOR_IMAGE:-ecafe-api-migrator:local}
    build:
      context: ../..
      dockerfile: Dockerfile
      target: migrator
    env_file:
      - ./api.env
    profiles:
      - migrate
    restart: "no"
